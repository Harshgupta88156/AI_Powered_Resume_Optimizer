spring.application.name=history-service
server.port=8086

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Shared resume DB
# Must be the SAME database resume-service writes to. This service only
# reads the resume_analyses tables that resume-service owns and creates;
# pointing it at a separate 'resume_db' meant every Trends/History query
# failed with CannotGetJdbcConnectionException against a database that was
# never created (see trends-error.txt).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resume_optimizer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Mahabharat@88156}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prevent abusive page-size values from exhausting memory
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

