<button
  type="button"
  class="theme-toggle"
  (click)="cycle()"
  [attr.title]="title"
  [attr.aria-label]="title">

  <span class="theme-icon" aria-hidden="true" [ngSwitch]="preference()">

    <!-- Light: sun -->
    <svg *ngSwitchCase="'light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>

    <!-- Dark: moon -->
    <svg *ngSwitchCase="'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>

    <!-- System: monitor -->
    <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="13" rx="2" />
      <path d="M8 21h8M12 17v4" />
    </svg>

  </span>

  <span class="theme-label">{{ label }}</span>

</button>
