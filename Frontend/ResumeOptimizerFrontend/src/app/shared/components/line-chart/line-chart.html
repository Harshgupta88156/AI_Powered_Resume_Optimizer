<div class="line-chart" *ngIf="hasData(); else empty">

  <div class="line-summary">
    <span><strong>{{ format(total()) }}</strong> total</span>
    <span><strong>{{ format(peak()) }}</strong> peak</span>
  </div>

  <svg
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    preserveAspectRatio="none"
    class="line-svg"
    role="img"
    aria-label="Activity over time">

    <defs>
      <linearGradient id="ro-area-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.28" />
        <stop offset="100%" stop-color="var(--primary)" stop-opacity="0" />
      </linearGradient>
    </defs>

    <path [attr.d]="areaPath()" fill="url(#ro-area-fill)" />

    <polyline
      [attr.points]="linePath()"
      fill="none"
      stroke="var(--primary)"
      stroke-width="2"
      stroke-linejoin="round"
      stroke-linecap="round"
      vector-effect="non-scaling-stroke" />

    <circle
      *ngFor="let d of dots()"
      [attr.cx]="d.x"
      [attr.cy]="d.y"
      r="2.5"
      fill="var(--primary)">
      <title>{{ d.point.label }}: {{ format(d.point.value) }}</title>
    </circle>

  </svg>

  <div class="line-axis" *ngIf="axisLabels() as ax">
    <span>{{ ax.first }}</span>
    <span>{{ ax.last }}</span>
  </div>

</div>

<ng-template #empty>
  <p class="chart-empty">No activity recorded yet.</p>
</ng-template>
