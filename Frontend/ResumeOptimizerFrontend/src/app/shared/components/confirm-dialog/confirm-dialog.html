<div class="dialog-backdrop" *ngIf="open" (click)="onCancel()">

  <div class="dialog-box" (click)="$event.stopPropagation()">

    <h3>{{ title }}</h3>
    <p>{{ message }}</p>

    <div class="dialog-actions">
      <button type="button" class="btn-secondary" (click)="onCancel()">{{ cancelLabel }}</button>
      <button type="button" class="btn-danger" [class.btn-primary]="!danger" (click)="onConfirm()">{{ confirmLabel }}</button>
    </div>

  </div>

</div>
