<div class="donut" *ngIf="hasData(); else empty">

  <svg viewBox="0 0 160 160" class="donut-svg" role="img" aria-label="Distribution chart">
    <g transform="rotate(-90 80 80)">
      <circle
        *ngFor="let slice of slices()"
        cx="80" cy="80" [attr.r]="radius"
        fill="none"
        [attr.stroke]="slice.color"
        stroke-width="20"
        [attr.stroke-dasharray]="slice.dash + ' ' + circumference"
        [attr.stroke-dashoffset]="slice.offset" />
    </g>

    <text x="80" y="75" class="donut-total">{{ format(total()) }}</text>
    <text x="80" y="93" class="donut-caption">total</text>
  </svg>

  <ul class="donut-legend">
    <li *ngFor="let slice of slices()">
      <span class="swatch" [style.background]="slice.color"></span>
      <span class="legend-label" [title]="slice.label">{{ slice.label }}</span>
      <span class="legend-value">{{ slice.share }}%</span>
    </li>
  </ul>

</div>

<ng-template #empty>
  <p class="chart-empty">Not enough data yet.</p>
</ng-template>
