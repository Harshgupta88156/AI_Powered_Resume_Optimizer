<div class="not-found">

  <div class="not-found-card">
    <p class="code">404</p>
    <h1>We couldn't find that page</h1>
    <p class="message">
      The link may be out of date, or the item it pointed to was deleted.
    </p>

    <div class="actions">
      <a [routerLink]="homeLink" class="btn-primary btn-sm">Go home</a>
      <a routerLink="/analysis" class="btn-ghost btn-sm">Run an analysis</a>
    </div>
  </div>

</div>
