<div class="callback-wrap">

  <app-spinner *ngIf="!failed()" label="Completing sign-in..." size="lg"></app-spinner>

  <div class="callback-error" *ngIf="failed()">
    <h1>Sign-in didn't complete</h1>
    <p>{{ failureMessage() }}</p>

    <div class="callback-actions">
      <button type="button" class="btn-primary btn-sm" (click)="retry()">Try GitHub again</button>
      <a routerLink="/login" class="btn-ghost btn-sm">Back to sign in</a>
    </div>
  </div>

</div>
