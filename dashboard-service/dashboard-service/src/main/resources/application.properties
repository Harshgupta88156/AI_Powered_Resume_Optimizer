spring.application.name=dashboard-service
server.port=${PORT:8085}

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

# dashboard-service owns NO database. If a datasource ever appears on the
# classpath, that is a design regression: this service must stay stateless.

# Feign timeouts - a dashboard fans out to several services, so one slow
# dependency must not be able to hold a request open indefinitely.
feign.connect-timeout-ms=${FEIGN_CONNECT_TIMEOUT_MS:3000}
feign.read-timeout-ms=${FEIGN_READ_TIMEOUT_MS:10000}

# How much history is pulled in to compute averages, charts and insights.
# page-size must not exceed resume-service's spring.data.web.pageable.max-page-size (100).
dashboard.fetch.page-size=${DASHBOARD_PAGE_SIZE:100}
dashboard.fetch.max-analyses=${DASHBOARD_MAX_ANALYSES:1000}
dashboard.fetch.max-resumes=${DASHBOARD_MAX_RESUMES:500}

# notification-service does not exist yet. Flip to true once it is registered
# in Eureka; until then the dashboard renders without notifications.
dashboard.notifications.enabled=${DASHBOARD_NOTIFICATIONS_ENABLED:false}

# Short-lived snapshot cache. Set ttl-seconds=0 to disable.
dashboard.cache.ttl-seconds=${DASHBOARD_CACHE_TTL_SECONDS:30}
dashboard.cache.max-entries=${DASHBOARD_CACHE_MAX_ENTRIES:1000}
