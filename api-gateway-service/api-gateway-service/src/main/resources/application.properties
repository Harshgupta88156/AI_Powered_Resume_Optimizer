spring.application.name=api-gateway-service
server.port=8080

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Disable webmvc auto-config (gateway is reactive/Netty)
spring.main.web-application-type=reactive

# JWT (same shared secret used by all services)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.issuer=auth-service

# Allowed browser origins (comma separated). Wildcards are not usable here
# because credentials are allowed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://127.0.0.1:4200,http://127.0.0.1:5173}

# Resume uploads pass through the gateway, so its limit must be >= resume-service's
spring.codec.max-in-memory-size=12MB

# Routes are defined programmatically in GatewayConfig.java
