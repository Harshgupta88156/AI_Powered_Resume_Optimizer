spring.application.name=notification-service
server.port=${PORT:8088}

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

# SMTP configuration - externalized, no credentials hardcoded.
# Switching provider (SES/SendGrid/Brevo/Mailgun) only requires changing
# EmailService's implementation, never the business logic in NotificationService.
#spring.mail.host=${MAIL_HOST:smtp.gmail.com}
#spring.mail.port=${MAIL_PORT:587}
#spring.mail.username=${MAIL_USERNAME:}
#spring.mail.password=${MAIL_PASSWORD:}
#spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
#spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
#spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECT_TIMEOUT_MS:10000}
#spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
#spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}
spring.mail.host=smtp.gmail.com
spring.mail.port=465

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# "From" identity used on every outgoing email.
notification.mail.from=${MAIL_FROM:no-reply@resumeoptimizer.com}
notification.mail.from-name=${MAIL_FROM_NAME:Resume Optimizer}

# Frontend base URL used to build call-to-action links (e.g. "Start Optimizing").
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# Thymeleaf templates live under classpath:/templates and are rendered to HTML
# strings for the email body (not used as MVC views).
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG
