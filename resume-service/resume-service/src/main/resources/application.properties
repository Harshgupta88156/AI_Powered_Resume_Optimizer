spring.application.name=resume-service
server.port=${PORT:8083}

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Batch the element-collection inserts (missing/suggested skills, suggestions)
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true

# Resume DB (env vars)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Upload limits - without these a single huge POST can exhaust heap/disk
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# AI Service - resolved through Eureka by the load-balanced RestTemplate.
# Use the service id, NOT a hardcoded host:port.
ai.service.base-url=${AI_SERVICE_BASE_URL:http://ai-service}
ai.service.analyze-endpoint=/api/ai/analyze
ai.service.generate-markdown-endpoint=/api/ai/generate-markdown
ai.service.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
# Must exceed ai-service's own ollama.timeout (120000ms) plus a safety margin,
# since resume-service waits on the whole ai-service call (which itself waits
# on Ollama). LaTeX generation in particular can run long on CPU-only models.
ai.service.read-timeout-ms=${AI_READ_TIMEOUT_MS:180000}

# Notification Service - resolved through Eureka by the load-balanced RestTemplate.
# Use the service id, NOT a hardcoded host:port.
notification.service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://notification-service}
notification.service.analysis-completed-endpoint=${NOTIFICATION_ANALYSIS_COMPLETED_ENDPOINT:/api/notifications/analysis-completed}

# Cap page size so ?size=1000000 can't be used to dump entire tables
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
