spring.datasource.url=jdbc:h2:mem:resume_service_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Tests must not try to reach a real service registry
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
ai.service.base-url=http://ai-service
ai.service.analyze-endpoint=/api/ai/analyze
ai.service.generate-markdown-endpoint=/api/ai/generate-markdown
notification.service.base-url=http://notification-service
notification.service.analysis-completed-endpoint=/api/notifications/analysis-completed
