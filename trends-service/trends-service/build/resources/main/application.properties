spring.application.name=trends-service
server.port=8087

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Shared resume DB (read-only query service)
# Must be the SAME database resume-service writes to. This service only
# reads the resume_analyses tables that resume-service owns and creates;
# pointing it at a separate 'resume_db' meant every Trends/History query
# failed with CannotGetJdbcConnectionException against a database that was
# never created (see trends-error.txt).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resume_optimizer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Mahabharat@88156}
spring.datasource.driver-class-name=org.postgresql.Driver

# Guardrails
trends.query.default-limit=${TRENDS_DEFAULT_LIMIT:10}
trends.query.max-limit=${TRENDS_MAX_LIMIT:100}
trends.query.max-range-days=${TRENDS_MAX_RANGE_DAYS:1825}

# notification-service - resolved through Eureka by a load-balanced RestTemplate.
# Weekly job below only sends prepared trend data; it never delegates trend
# calculation to notification-service.
notification.service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://notification-service}
notification.service.weekly-trends-endpoint=/api/notifications/weekly-trends
notification.service.connect-timeout-ms=${NOTIFICATION_CONNECT_TIMEOUT_MS:3000}
notification.service.read-timeout-ms=${NOTIFICATION_READ_TIMEOUT_MS:5000}

# Weekly trends email - comma-separated recipient list and cron schedule.
# No notification database/preferences exist, so recipients are configured
# here rather than resolved per-user.
notification.weekly-trends.recipients=${WEEKLY_TRENDS_RECIPIENTS:admin@resumeoptimizer.com}
notification.weekly-trends.cron=${WEEKLY_TRENDS_CRON:0 0 7 * * MON}


