spring.application.name=ai-service
server.port=${PORT:8084}

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-2.0-flash}
gemini.api-key=${GEMINI_API_KEY}
gemini.generate-endpoint=/v1beta/models/{model}:generateContent