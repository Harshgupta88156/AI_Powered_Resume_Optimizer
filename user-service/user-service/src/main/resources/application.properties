spring.application.name=user-service

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

# Server
server.port=${PORT:8081}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Users DB (env vars with local fallback defaults)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT (must match auth-service's jwt.secret so tokens validate here)
jwt.secret=${JWT_SECRET}
jwt.issuer=auth-service

# Shared secret for service-to-service calls from auth-service.
# MUST match auth-service's internal.api-key.
internal.api-key=${INTERNAL_API_KEY:change-this-internal-service-key-in-prod}

# Cap page size so ?size=1000000 can't be used to dump the whole table
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
