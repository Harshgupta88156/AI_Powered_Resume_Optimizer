spring.datasource.url=jdbc:h2:mem:auth_service_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Tests must not try to reach a real service registry
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

jwt.secret=test-secret-key-that-is-long-enough-for-hs256-0123456789
jwt.expiration-ms=900000
jwt.issuer=auth-service
jwt.refresh-expiration-ms=604800000
jwt.refresh-retention-days=30
jwt.refresh-cleanup-cron=0 15 3 * * *

internal.api-key=test-internal-api-key
feign.connect-timeout-ms=3000
feign.read-timeout-ms=10000

spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email
app.oauth2.redirect-uri=

