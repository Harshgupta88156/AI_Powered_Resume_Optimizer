spring.application.name=auth-service
server.port=${PORT:8082}

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_SECURE_PORT:443}

# Auth DB (stores refresh tokens; env vars with local fallback defaults)
spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USERNAME}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (shared secret across services; override via env in real deployments)
# Secret must be long enough for HS256 (>= 32 bytes / 256 bits).
jwt.secret=${JWT_SECRET}
# Access token validity in milliseconds.
#
# Raised from 15 minutes to 4 hours. The frontend now transparently exchanges an
# expired access token for a new one using the refresh token, so a short TTL no
# longer forced a re-login - but 15 minutes still meant a token refresh on
# almost every page load, and any hiccup in that exchange showed up as a random
# logout. 4 hours keeps the revocation window sensible while making refreshes
# rare enough to be invisible.
jwt.expiration-ms=${JWT_EXPIRATION_MS:14400000}
jwt.issuer=auth-service
# Refresh token validity in milliseconds (default 30 days).
# This is the real "stay signed in" window - the frontend rotates it silently,
# so the user stays logged in for as long as they keep using the app.
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
# Housekeeping: how long revoked/expired rows are kept, and when the purge runs
jwt.refresh-retention-days=${JWT_REFRESH_RETENTION_DAYS:30}
jwt.refresh-cleanup-cron=${JWT_REFRESH_CLEANUP_CRON:0 15 3 * * *}

# Shared secret sent on every service-to-service call to user-service.
# MUST match user-service's internal.api-key.
internal.api-key=${INTERNAL_API_KEY:change-this-internal-service-key-in-prod}

# Feign timeouts - without these a stalled user-service would hang every login
feign.connect-timeout-ms=${FEIGN_CONNECT_TIMEOUT_MS:3000}
feign.read-timeout-ms=${FEIGN_READ_TIMEOUT_MS:10000}

# GitHub OAuth2 — MUST be configured before GitHub login will work.
#
# HOW TO SET UP:
#   1. Go to https://github.com/settings/developers → "New OAuth App"
#   2. Application name: Resume Optimizer (or anything you like)
#   3. Homepage URL: http://localhost:4200
#   4. Authorization callback URL:
#      https://resume-optimizer-gateway.onrender.com/login/oauth2/code/github
#      This MUST match the redirect-uri below exactly.
#   5. Click "Register application"
#   6. Copy the Client ID → set as GITHUB_CLIENT_ID env var
#   7. Generate a new client secret → set as GITHUB_CLIENT_SECRET env var
#
# Without valid credentials the GitHub authorize page returns 404.
# The placeholder values below are non-functional — set the env vars.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
# MUST point at the API gateway, not at auth-service directly.
#
# The handshake now starts at the gateway (:8080), so the OAuth2 session cookie
# that holds the pending authorization request is scoped to :8080. {baseUrl}
# would resolve to auth-service's own :8082, and the browser would send no
# cookie there - Spring would then fail the callback with
# "authorization_request_not_found". Routing the callback back through the
# gateway keeps the whole flow on one origin.
#
# The callback URL registered in the GitHub OAuth App must match this exactly.
spring.security.oauth2.client.registration.github.redirect-uri=${OAUTH2_CALLBACK_URI:https://resume-optimizer-gateway.onrender.com/login/oauth2/code/github}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Where to send the browser after a successful GitHub login. If a frontend URL
# is set, tokens are appended as query params; otherwise the tokens are returned
# as a JSON response (handy for testing without a frontend).
app.oauth2.redirect-uri=${OAUTH2_SUCCESS_REDIRECT_URI:https://ai-powered-resume-optimizer-1.onrender.com/oauth2/callback}



# The OAuth handshake is the only thing that needs a session here, and the
# success handler invalidates it immediately. A short timeout means an abandoned
# sign-in cannot leave a usable session lying around.
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Logging. DEBUG on the security packages is extremely noisy and prints tokens;
# set SECURITY_LOG_LEVEL=DEBUG when actually debugging the OAuth flow.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}
logging.level.com.resumeoptimizer=${APP_LOG_LEVEL:INFO}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never